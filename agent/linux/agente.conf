# Configuração do agente do Painel Self-Checkout
# Fica em /etc/painel-self/agente.conf no caixa.

# Um ou mais painéis, separados por espaço. O primeiro é o principal;
# os outros (ex.: o de teste) recebem uma cópia e não atrasam o principal se estiverem fora.
SERVIDOR=http://IP-DO-PAINEL:8080
TOKEN=cole-aqui-o-tokenAgente-do-config.json

# Loja e PDV: em branco = lidos do AcruxPDV (/c5client/AcruxPDV/AcruxPDV.info)
LOJA=
PDV=
# NOME=Self 01
PORTA_VNC=5900
PORTA_LOCAL=8765
INTERVALO=5

# Leitura dos logs do AcruxPDV (1 = ligado)
LER_LOGS_ACRUX=1
PASTA_LOGS_ACRUX=/c5client/AcruxPDV/log/aplicacao
# Segundos de tolerância antes de virar alerta
SEGUNDOS_PESO=15
SEGUNDOS_MENSAGEM=45
# Sem movimento de venda por este tempo, o caixa volta a "livre" (venda abandonada/cancelada)
SEGUNDOS_VENDA_PARADA=300
